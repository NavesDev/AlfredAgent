<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mordomo: v7</title>
<style>
  :root { --bg:#0a0a0b; --card:#111113; --line:#26262a; --dim:#4b4b52; --mid:#8a8a93; --hi:#e8e8ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--hi); font:14px/1.5 system-ui, sans-serif; padding:24px; }
  h2 { margin:0 0 4px; font-weight:500; }
  h3.st { margin:30px 0 2px; font-weight:500; font-size:16px; }
  .sub { color:var(--mid); margin:0 0 6px; max-width:940px; font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; margin-top:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; cursor:pointer; transition:border-color .2s; }
  .card:hover { border-color:#3a3a40; }
  .card.selected { border-color:var(--hi); box-shadow:0 0 0 1px var(--hi) inset; }
  .stage { height:190px; display:flex; align-items:center; justify-content:center; gap:26px; }
  .big { width:150px; height:133px; } .small { width:40px; height:36px; position:relative; }
  .big svg, .small svg { width:100%; height:100%; overflow:visible; }
  .sw { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:110px; }
  .sw .n { font-size:12px; } .sw .a { font:10px ui-monospace,monospace; color:var(--mid); min-height:15px; text-align:center; }
  .subsq { position:absolute; width:6px; height:6px; border:1px solid var(--mid); background:var(--card); left:50px; top:-6px; opacity:0; transition:opacity .3s; }
  .subsq.on { opacity:1; animation: flash 1.2s ease-out infinite; }
  @keyframes flash { 0%,100% { background:var(--card); } 15% { background:var(--hi); box-shadow:0 0 8px #fff; } 40% { background:var(--card); } }
  .subline { position:absolute; left:36px; top:2px; width:15px; height:1px; background:#3a3a40; transform:rotate(-22deg); transform-origin:left; opacity:0; transition:opacity .3s; }
  .subline.on { opacity:1; }
  .body { padding:10px 14px 14px; border-top:1px solid var(--line); }
  .body b { font-weight:500; } .body p { margin:2px 0 0; color:var(--mid); font-size:12.5px; }
  .tag { font-size:10px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  .timeline { display:flex; gap:3px; margin-top:8px; }
  .timeline span { flex:1; height:3px; border-radius:2px; background:#222226; }
  .timeline span.on { background:var(--mid); }

  .bob { animation: bob .5s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(.7px); } }
  .tapA { animation: tapA .22s steps(1) infinite; } .tapB { animation: tapB .22s steps(1) infinite; }
  @keyframes tapA { 50% { transform: translateY(-1.5px); } } @keyframes tapB { 0% { transform: translateY(-1.5px); } 50% { transform: translateY(0); } }
  .blink { animation: blink 3.2s steps(1) infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
  .sweep { animation: sweep 1.4s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform: translate(-2px,0); } to { transform: translate(2px,1px); } }
  .look { animation: look 1.4s ease-in-out infinite alternate; }
  @keyframes look { from { transform: translateX(-1px); } to { transform: translateX(1px); } }
  .tick { animation: tick 1s steps(8) infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes tick { to { transform: rotate(360deg); } }
  .ring { animation: ring .14s steps(2) infinite; transform-box: view-box; transform-origin: 29px 14.5px; }
  @keyframes ring { 0% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
  .ripple { animation: ripple .8s ease-out infinite; opacity:0; transform-box: fill-box; transform-origin:center; }
  @keyframes ripple { 0% { opacity:.9; transform: scale(.4); } 100% { opacity:0; transform: scale(1.7); } }
  .write { animation: write .5s ease-in-out infinite alternate; }
  @keyframes write { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px) translateY(.3px); } }
  .ink { animation: ink 3s steps(6) infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes ink { from { transform: scaleX(.1); } to { transform: scaleX(1); } }
  .flip { animation: flip 2s steps(1) infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes flip { 0%,75% { transform: scaleX(1); } 80%,100% { transform: scaleX(-1); } }
  .chk { opacity:0; animation: chk 2.4s steps(1) infinite; } .chk2 { animation-delay:.6s; } .chk3 { animation-delay:1.2s; }
  @keyframes chk { 0%,30% { opacity:0; } 31%,100% { opacity:1; } }
  .fly { animation: fly 1.4s ease-in forwards; }
  @keyframes fly { 0%,25% { transform: translate(0,0) scale(1); opacity:1; } 100% { transform: translate(12px,-14px) scale(.5); opacity:0; } }
  .pop { animation: pop .6s ease-out infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes pop { 0% { transform: scale(.2); opacity:1; } 100% { transform: scale(1.6); opacity:0; } }
  .ding { animation: ding 1.1s ease-out forwards; }
  @keyframes ding { 0% { opacity:0; transform: translateY(1px); } 20% { opacity:1; } 100% { opacity:0; transform: translateY(-4px); } }
  .steam { animation: steam 1.8s ease-out infinite; opacity:0; } .steam2 { animation-delay:.9s; }
  @keyframes steam { 0% { opacity:0; transform: translateY(0); } 30% { opacity:.9; } 100% { opacity:0; transform: translateY(-4px); } }
  .sparkle { animation: sparkle .5s steps(2) infinite; }
  @keyframes sparkle { 50% { opacity:.15; } }
  .rise { animation: rise 1.6s ease-out forwards; }
  @keyframes rise { from { transform: translateY(3px); opacity:0; } 30% { opacity:1; } to { transform: translateY(-3px); opacity:1; } }
  .sway { animation: sway 1.4s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 29px 16px; }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .pulse { animation: pulse 1.4s ease-out infinite; opacity:0; transform-box: fill-box; transform-origin:center; }
  @keyframes pulse { 0% { opacity:.8; transform: scale(.7); } 100% { opacity:0; transform: scale(1.5); } }
  .tilt { animation: tilt 2.8s ease-in-out infinite; transform-box: view-box; transform-origin: 16px 14px; }
  @keyframes tilt { 0%,30%,100% { transform: rotate(0); } 45%,85% { transform: rotate(8deg); } }
  .tapfoot { animation: tapfoot .45s steps(1) infinite; }
  @keyframes tapfoot { 50% { transform: translateY(-1px); } }

  .finger { animation: finger .6s ease-in-out infinite alternate; }
  @keyframes finger { from { transform: translateY(-.8px); } to { transform: translateY(.8px); } }
  .glint { animation: glint 1.8s steps(1) infinite; }
  @keyframes glint { 0%,80% { opacity:0; } 82%,90% { opacity:1; } 92% { opacity:0; } }
  .read { animation: read 2.4s steps(1) infinite; }
  @keyframes read { 0% { transform: translateX(-1px); } 25% { transform: translateX(0); } 50% { transform: translateX(1px); } 75% { transform: translate(-1px,.5px); } }
  .reflect { animation: reflect 1.6s linear infinite; }
  @keyframes reflect { from { transform: translateY(1.5px); opacity:.0; } 30% { opacity:.35; } to { transform: translateY(-2px); opacity:0; } }
  .ico { opacity:0; animation: ico 3s steps(1) infinite; } .ico2 { animation-delay:1s; } .ico3 { animation-delay:2s; }
  @keyframes ico { 0%,33% { opacity:1; } 34%,100% { opacity:0; } }
  .zoomm { animation: zoomm 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin:center; }
  @keyframes zoomm { to { transform: scale(1.25); } }
  .dots span { }
  .dot { opacity:.2; animation: dot 1.2s steps(1) infinite; } .dot2 { animation-delay:.3s; } .dot3 { animation-delay:.6s; }
  @keyframes dot { 0%,40% { opacity:1; } 41%,100% { opacity:.2; } }
  .fill { animation: fill 2.6s steps(10) infinite; transform-box: fill-box; transform-origin:left; }
  @keyframes fill { from { transform: scaleX(.05); } 85%,100% { transform: scaleX(1); } }
  .donechk { opacity:0; animation: donechk 2.6s steps(1) infinite; }
  @keyframes donechk { 0%,85% { opacity:0; } 86%,100% { opacity:1; } }
  .drum1, .drum2, .drum3 { animation: drum .45s steps(1) infinite; } .drum2 { animation-delay:.15s; } .drum3 { animation-delay:.3s; }
  @keyframes drum { 0%,33% { transform: translateY(-1px); } 34%,100% { transform: translateY(0); } }
  .sweatd { animation: sweatd 1.8s ease-in infinite; }
  @keyframes sweatd { 0% { transform: translateY(0); opacity:1; } 100% { transform: translateY(3px); opacity:0; } }
  .corn { opacity:0; animation: corn 1.8s ease-out infinite; } .corn2 { animation-delay:.6s; } .corn3 { animation-delay:1.2s; }
  @keyframes corn { 0% { opacity:0; transform: translate(0,0); } 15% { opacity:1; } 100% { opacity:0; transform: translate(var(--dx),-9px); } }
  .slam { animation: slam .25s ease-out 1; }
  .kpress { animation: ripple .5s ease-out 1; opacity:0; transform-box: fill-box; transform-origin:center; }
</style>
</head>
<body>
<h2>Mordomo — v7</h2>
<p class="sub">Todas as fases agora acontecem no laptop, no padrão do "digitando". Cards parados = animação contínua; com barra = sequência.</p>
<div id="root"></div>

<script>
const C = { suit:'#34343e', suit2:'#45454f', head:'#5a5a64', hat:'#26262e', band:'#45454f', mid:'#8a8a93', dim:'#4b4b52', p1:'#2a2a2f', hi:'#e8e8ec', paper:'#d9d6cc', purple:'#6d4cff', purple2:'#8d6cff', black:'#0c0c0e', silver:'#c8c8cc' };
const r = (x,y,w,h,f,extra='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
const svg = (inner) => `<svg viewBox="0 0 36 32" shape-rendering="crispEdges">${inner}</svg>`;

const hat = (t='') => `<g transform="${t}">${r(11,1,10,3,C.hat)}${r(11,3,10,1,C.band)}${r(9,4,14,1,C.hat)}</g>`;
const EYES = {
  open:   `<g class="blink">${r(12,8,2,1,C.hi)}${r(18,8,2,1,C.hi)}</g>`,
  closed: `${r(12,9,2,.6,C.mid)}${r(18,9,2,.6,C.mid)}`,
  down:   `${r(12,9,2,1,C.hi)}${r(18,9,2,1,C.hi)}`,
  wide:   `${r(12,7,2,2,C.hi)}${r(18,7,2,2,C.hi)}`,
  happy:  `${r(12,8,1,1,C.hi)}${r(13,7,1,1,C.hi)}${r(14,8,1,1,C.hi)}${r(18,8,1,1,C.hi)}${r(19,7,1,1,C.hi)}${r(20,8,1,1,C.hi)}`,
  right:  `<g class="look">${r(13,8,1,1,C.hi)}${r(19,8,1,1,C.hi)}</g>`,
  ask:    `${r(12,8,2,1,C.hi)}${r(18,8,2,1,C.hi)}${r(12,6.4,2,.6,C.mid)}${r(18,5.6,2,.6,C.mid)}`,
};
const monocle = () => `<rect x="17.25" y="7.25" width="3.5" height="2.5" fill="none" stroke="${C.mid}" stroke-width=".5"/>${r(20.5,9.5,.5,3,C.mid)}`;
const face = (e='open', mono=true) => `${r(10,5,12,9,C.head)}${EYES[e]}${mono?monocle():''}${r(12,11,3,1,C.mid)}${r(17,11,3,1,C.mid)}${r(15,10,2,1,C.mid)}`;
const torso = () => `${r(11,14,10,7,C.suit)}${r(14,14,4,6,C.hi)}${r(13,15,1,4,C.suit2)}${r(18,15,1,4,C.suit2)}${r(13,14,2,2,C.purple)}${r(17,14,2,2,C.purple)}${r(15,14.5,2,1,C.purple2)}`;
const armL = (y=15,h=6,cls='') => `<g class="${cls}">${r(8,y,3,h,C.suit)}${r(8,y+h-1,3,1,C.hi)}</g>`;
const armR = (y=15,h=6,cls='') => `<g class="${cls}">${r(21,y,3,h,C.suit)}${r(21,y+h-1,3,1,C.hi)}</g>`;
const armFwd = (y=15) => `${r(21,15,3,3,C.suit)}${r(24,y,4,2,C.suit)}${r(28,y,2,2,C.hi)}`; // hand at x28-29
const legs = (tap=false) => `${r(13,21,2,3,C.suit)}${r(17,21,2,3,C.suit)}<g class="${tap?'tapfoot':''}">${r(12,24,3,1,C.hat)}</g>${r(17,24,3,1,C.hat)}`;
const laptop = () => `${r(4,22,23,2,C.dim)}${r(7,24,17,1,C.p1)}`;
const seated = (e, rightArm, mono=true, extra='') => `<g class="bob">${hat()}${face(e,mono)}</g>${torso()}${extra}${rightArm}${laptop()}`;
const check = (x,y,f=C.black,s=1) => [[0,1],[1,2],[2,1],[3,0]].map(([a,b])=>r(x+a*s,y+b*s,s,s,f)).join('');

/* ---------------- 3a: phase props ---------------- */
const P = {
  type: seated('open', armR(16,6,'tapB'), true, armL(16,6,'tapA')),
  lupa: seated('right', `<g class="sweep">${r(21,14,3,3,C.suit)}${r(24,12,2,4,C.suit)}${r(24,11,2,1.5,C.hi)}<path d="M25.5 11 L26.8 9.2" stroke="${C.mid}" stroke-width=".9"/><circle cx="28.3" cy="7.3" r="2.6" fill="#ffffff18" stroke="${C.silver}" stroke-width=".7"/></g>`, false, armL(16,6)),
  book: seated('down', `${r(21,15,3,5,C.suit)}`, true, `${r(8,15,3,5,C.suit)}${r(10,16,6,5,C.hi)}<g class="flip" style="transform-origin:16px 0">${r(16,16,6,5,C.paper)}</g>${r(15.8,16,.4,5,C.dim)}${r(11,17.5,4,.4,C.dim)}${r(11,19,4,.4,C.dim)}${r(17,17.5,4,.4,C.dim)}${r(9,19,2,2,C.hi)}${r(21,19,2,2,C.hi)}`),
  quill: seated('down', `<g class="write">${r(21,15,3,4,C.suit)}${r(21,18,3,1,C.hi)}<path d="M23 19.5 L27 12 L28 12.5 L24 19.8 Z" fill="${C.hi}"/></g>`, true, `${armL(16,6)}${r(14,20,13,2,C.paper)}<rect class="ink" x="15" y="20.7" width="8" height=".5" fill="${C.black}"/>`),
  watch: seated('wide', `${r(21,15,3,4,C.suit)}${r(21,18,3,1,C.hi)}<circle cx="26" cy="19" r="2.6" fill="${C.silver}"/><circle cx="26" cy="19" r="2" fill="${C.black}"/><rect class="tick" x="25.75" y="17.5" width=".5" height="1.5" fill="${C.hi}"/>${r(25.6,15.8,.8,.8,C.mid)}`, true, armL(16,6,'tapA')),
  clip: seated('wide', `${r(21,15,3,4,C.suit)}${r(23,11,7,10,C.mid)}${r(24,12,5,8,C.hi)}${r(25.5,10.5,2,1.2,C.dim)}
     ${[13.5,15.8,18.1].map((y,i)=>`${r(24.5,y,1.2,1.2,C.dim)}${r(26.2,y+.4,2.3,.4,C.dim)}<g class="chk ${i?'chk'+(i+1):''}">${check(24.2,y-.3,C.black,.5)}</g>`).join('')}${r(21,18,3,1,C.hi)}`, true, armL(16,6,'tapA')),
};

/* ---------------- 3b: calling a subagent ---------------- */
const E = {
  bell: seated('happy', `${r(21,14,3,3,C.suit)}${r(24,13,4,2,C.suit)}${r(28,12.5,2,2.5,C.hi)}<g class="ring">${r(28.7,15,.6,1.5,C.mid)}<path d="M26.8 20 Q26.8 16.3 29 16.3 Q31.2 16.3 31.2 20 Z" fill="${C.silver}"/>${r(26.5,20,5,.6,C.mid)}${r(28.7,20.6,.6,.7,C.dim)}</g><circle class="ripple" cx="29" cy="18" r="5" fill="none" stroke="${C.mid}" stroke-width=".4"/><circle class="ripple" cx="29" cy="18" r="5" fill="none" stroke="${C.mid}" stroke-width=".4" style="animation-delay:.4s"/>`, true, armL(16,6)),
  deskUp: seated('open', `${r(21,14,3,3,C.suit)}${r(24,13,3,2,C.suit)}${r(27,12.5,2,2,C.hi)}`, true, `${armL(16,6)}${r(25.5,21,5,1,C.dim)}<path d="M26 21 Q26 18.5 28 18.5 Q30 18.5 30 21 Z" fill="${C.silver}"/>${r(27.7,17.6,.6,.9,C.mid)}`),
  deskDown: seated('happy', `${r(21,15,3,3,C.suit)}${r(24,16,3,2,C.suit)}${r(27,16.5,2,1.5,C.hi)}`, true, `${armL(16,6)}${r(25.5,21,5,1,C.dim)}<path d="M26 21 Q26 18.5 28 18.5 Q30 18.5 30 21 Z" fill="${C.silver}"/>${r(27.7,18,.6,.5,C.mid)}<circle class="ripple" cx="28" cy="19" r="4" fill="none" stroke="${C.mid}" stroke-width=".4"/><text class="ding" x="27" y="13" font-size="3" fill="${C.hi}" font-family="monospace">ding!</text>`),
  letterHold: seated('open', armFwd(15), true, `${armL(16,6)}${r(25,10.5,7,4.5,C.hi)}<path d="M25 10.5 L28.5 13 L32 10.5" fill="none" stroke="${C.mid}" stroke-width=".4"/>${r(27.9,12.3,1.3,1.3,C.purple)}`),
  letterFly: seated('happy', armFwd(15), true, `${armL(16,6)}<g class="fly" style="transform-box:fill-box;transform-origin:center">${r(25,10.5,7,4.5,C.hi)}<path d="M25 10.5 L28.5 13 L32 10.5" fill="none" stroke="${C.mid}" stroke-width=".4"/>${r(27.9,12.3,1.3,1.3,C.purple)}</g>`),
  snap: seated('happy', `${r(21,8,3,7,C.suit)}${r(21,7,3,1,C.hi)}<g>${r(25.5,5.5,1,1,C.hi,'class="sparkle"')}${r(27,4,.8,.8,C.hi,'class="sparkle"')}${r(26.7,6.6,.8,.8,C.hi,'class="sparkle"')}</g><circle class="pop" cx="25" cy="6" r="2" fill="none" stroke="${C.hi}" stroke-width=".4"/>`, true, armL(16,6)),
};

/* ---------------- terminou ---------------- */
const stand = (e, rightArm, extra='', hatT='') => `${hat(hatT)}${face(e)}${torso()}${armL()}${rightArm}${legs()}${extra}`;
const tray = () => r(24,14,10,1,C.mid);
const cloche = (lift) => `<g transform="${lift?'translate(1.5,-4) rotate(-22 29 14)':''}"><path d="M25 14 Q25 10 29 10 Q33 10 33 14 Z" fill="${C.silver}"/>${r(28.5,9,1,1,C.mid)}</g>`;
const sparkles = (cx,cy) => `<g class="sparkle">${r(cx-3,cy-1,.8,.8,C.hi)}${r(cx+3,cy-2,.8,.8,C.hi)}${r(cx+2.2,cy+1,.6,.6,C.hi)}${r(cx-2.4,cy+1.5,.6,.6,C.hi)}</g>`;
const B = {
  cloche: [
    [stand('open', armFwd(15), tray()+cloche(false)), 900],
    [stand('happy', armFwd(15), tray()+cloche(true)), 200],
    [stand('happy', armFwd(15), tray()+cloche(true)+`<g class="rise">${check(27,11,C.hi,1)}</g>`+sparkles(29,11)), 1500],
    [stand('open', armFwd(15), tray()+cloche(false)), 500],
  ],
  tea: [
    [stand('open', armFwd(15), tray()+`${r(26,11,4,3,C.hi)}${r(30,11.5,1,1.5,C.hi)}${r(25.5,13.5,5,.5,C.silver)}<rect class="steam" x="27" y="8" width=".6" height="2" fill="${C.mid}"/><rect class="steam steam2" x="28.6" y="8" width=".6" height="2" fill="${C.mid}"/>`), 2200],
    [stand('happy', armFwd(15), tray()+`${r(26,11,4,3,C.hi)}${r(30,11.5,1,1.5,C.hi)}${r(25.5,13.5,5,.5,C.silver)}<rect class="steam" x="27" y="8" width=".6" height="2" fill="${C.mid}"/><rect class="steam steam2" x="28.6" y="8" width=".6" height="2" fill="${C.mid}"/>`), 1200],
  ],
  letter: [
    [stand('open', armFwd(15), tray()+`${r(25,10,8,4,C.hi)}<path d="M25 10 L29 12.5 L33 10" fill="none" stroke="${C.mid}" stroke-width=".4"/>${r(28.4,11.8,1.3,1.3,C.purple)}`), 1000],
    [stand('happy', armFwd(15), tray()+`${r(25,10,8,4,C.hi)}<path d="M25 10 L29 6.5 L33 10 Z" fill="${C.paper}"/><g class="rise">${r(26.5,6,5,5,C.paper)}${check(27.5,7.5,C.black,.8)}</g>`+sparkles(29,7)), 1700],
  ],
  pop: [
    [stand('open', armFwd(15), tray()+cloche(false)), 800],
    [stand('wide', armFwd(15), tray()+cloche(true)+`<g class="rise">${check(26,7,C.hi,1.4)}</g>`), 500],
    [stand('happy', armFwd(15), tray()+cloche(true)+`${check(26,4,C.hi,1.4)}`+sparkles(28,6)+`<circle class="pop" cx="28" cy="5.5" r="3" fill="none" stroke="${C.hi}" stroke-width=".4"/>`), 1400],
    [stand('open', armFwd(15), tray()+cloche(false)), 400],
  ],
};
// reverência
const armUpToHat = (y) => `${r(22,y+1,3,14-y,C.suit)}${r(22,y,3,1,C.hi)}`;
const bowTorso = () => `${r(11,16,10,5,C.suit)}${r(14,17,4,3,C.hi)}${r(13,17,1,3,C.suit2)}${r(18,17,1,3,C.suit2)}${r(13,16,2,1.5,C.purple)}${r(17,16,2,1.5,C.purple)}${r(15,16.2,2,1,C.purple2)}`;
const headDown = (e='closed', hatOn=false) => `<g transform="translate(0,2.5)">${hatOn?hat():''}${face(e)}</g>`;

       <g class="ico ico2">${r(29.5,1.3,3,4,C.dim)}${r(30.2,2.3,1.6,.4,C.hi)}${r(30.2,3.3,1.6,.4,C.hi)}</g>

       <g class="reflect">${r(11,9.5,10,.3,'#ffffff')}${r(11,11.5,7,.3,'#ffffff')}</g></g>${torso()}${armL(16,6)}${armR(16,6)}${laptop()}`,
  // testar
  T1a: seated('wide', `${r(21,8,3,9,C.suit)}${glove(21,7)}`, true, armL(16,6)),

       <g>${r(25,4,1.2,1.2,C.hi,'class="dot"')}${r(27,4,1.2,1.2,C.hi,'class="dot dot2"')}${r(29,4,1.2,1.2,C.hi,'class="dot dot3"')}</g>`),

  T3: seated('wide', `${r(21,16,3,6,C.suit)}${r(21,21,1,1,C.hi,'class="drum1"')}${r(22,21,1,1,C.hi,'class="drum2"')}${r(23,21,1,1,C.hi,'class="drum3"')}`, true, `${armL(16,6)}<rect class="sweatd" x="9" y="6" width=".8" height="1.4" fill="${C.mid}"/>`),

const root = document.getElementById('root');
root.innerHTML = SECTIONS.map((s, si) => `
  <h3 class="st">${s.title}</h3><p class="sub">${s.note}</p>
  <div class="cards">${s.items.map(([tag,name,desc,frames], ii) => `
    <div class="card" data-choice="${si}-${tag}" onclick="toggleSelect(this)">
      <div class="stage"><div class="big" id="b${si}-${ii}"></div>
        <div class="sw"><div class="small"><div class="subline" id="l${si}-${ii}"></div><div class="subsq" id="q${si}-${ii}"></div><div id="s${si}-${ii}" style="width:100%;height:100%"></div></div><div class="n">backend</div><div class="a" id="t${si}-${ii}"></div></div></div>
      <div class="body"><span class="tag">${tag}</span> <b>${name}</b><p>${desc}</p>
        ${frames.length>1?`<div class="timeline" id="tl${si}-${ii}">${frames.map(()=>'<span></span>').join('')}</div>`:''}</div>
    </div>`).join('')}</div>`).join('');

SECTIONS.forEach((s, si) => s.items.forEach(([, , , frames], ii) => {
  let i = 0;
  const show = () => {
    const [svgStr, ms, label, sub] = frames[i];
    document.getElementById(`b${si}-${ii}`).innerHTML = svgStr;
    document.getElementById(`s${si}-${ii}`).innerHTML = svgStr;
    document.getElementById(`t${si}-${ii}`).textContent = label || '';
    document.getElementById(`q${si}-${ii}`).classList.toggle('on', !!sub);
    document.getElementById(`l${si}-${ii}`).classList.toggle('on', !!sub);
    const tl = document.getElementById(`tl${si}-${ii}`);
    if (tl) [...tl.children].forEach((c, k) => c.classList.toggle('on', k === i));
    if (frames.length > 1) setTimeout(() => { i = (i + 1) % frames.length; show(); }, ms);
  };
  show();
}));
</script>
