# openWakeWord training config. Paths are relative to .work/ (train.sh cds there).
model_name: alfred
# Spellings checked by transcribing Piper output: "alfredi"/"auf red" came out as "offered".
target_phrase: ["alfred", "alfredo", "hey alfred"]
custom_negative_phrases: ["offered", "afraid", "alfa", "fred", "frete", "alface", "all for it"]

n_samples: 30000
n_samples_val: 3000
tts_batch_size: 50
augmentation_batch_size: 16
augmentation_rounds: 1
total_length: 32000

piper_sample_generator_path: ./piper-sample-generator
output_dir: ./output
rir_paths: [./mit_rirs]
background_paths: [./audioset_16k]
background_paths_duplication_rate: [1]
false_positive_validation_data_path: ./validation_set_features.npy
feature_data_files:
  ACAV100M_sample: ./openwakeword_features_ACAV100M_2000_hrs_16bit.npy

model_type: dnn
layer_size: 32
steps: 50000
max_negative_weight: 500
target_false_positives_per_hour: 1.0  # 0.2 doubled the negative weight twice and made the model too conservative (recall 23%)
batch_n_per_class:
  ACAV100M_sample: 1024
  adversarial_negative: 50
  positive: 50
