[project]
name = "alfred-server"
version = "0.2.0"
description = "Alfred voice assistant server: voice loop, agents and API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "watchfiles>=1.3.0",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "numpy>=2.4.6",
    "openwakeword>=0.6.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["wakeword/train"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

# CUDA 12 torch: its nvidia-cublas/cudnn wheels also serve faster-whisper (CTranslate2
# needs CUDA 12 + cuDNN 9, so not cu13x). See ADR 0010.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
