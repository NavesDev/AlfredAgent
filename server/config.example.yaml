# Copy to config.yaml and adjust. Secrets go in .env, never here.

whisper:
  model: large-v3-turbo      # medium if RAM is tight
  device: cuda               # cuda | cpu; cuda loads on the wake word, CPU fallback if busy
  compute_type: int8_float16 # int8 on cpu
  language: pt
  initial_prompt: "Spring, Liferay, endpoint, worktree, commit, backend, frontend"
  idle_s: 30                 # releases the GPU after this long unused (image jobs need it)

kokoro:
  voice: pf_dora             # or pm_alex
  speed: 1.1
  device: cuda               # cuda | cpu; CPU fallback if the GPU is busy
  idle_s: 10
  # Said right when you stop talking, while Whisper and Claude work. Empty = chime only.
  acknowledgements: ["Certo.", "Deixa eu ver.", "Um momento.", "Só um instante."]

wakeword:
  name: Alfred
  model: wakeword/alfred.onnx  # trained by wakeword/train; or a pretrained name like hey_jarvis
  threshold: 0.5
  aliases: [alfred, alfredo]

listener:
  sample_rate: 16000
  silence_ms: 1800           # pause that ends a command; lower cuts you mid-sentence
  max_record_s: 60
  guess_ms: 400              # pause that starts Whisper early; ready when silence_ms ends

agents:
  default_model: sonnet
  models:                    # seeds per agent kind; edited on the panel (/settings) afterwards
    alfred: sonnet
    geral: sonnet
    implementacao: opus
  light_model: haiku         # simple questions + RESUMO fallback
  timeout_s: 60

limits:                      # seeds; edited on the panel afterwards
  max_active_sessions: 3     # open claude processes, not registered sessions
  idle_minutes: 10           # an idle session closes its process and resumes on the next task

permissions:
  default_confirmation: voice      # voice | key | web | voice+key
  per_action:
    git_push: key
    send_email: voice+key
    delete_file: voice
    install_dependency: voice
  tainted_turn: key
  timeout_s: 60                    # no answer = denied

router:
  fuzzy_threshold: 85

api:
  host: 0.0.0.0
  port: 8000

storage:
  db_path: data/alfred.sqlite3
  state_path: data/alfred_state.json
