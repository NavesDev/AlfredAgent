# Copy to config.yaml and adjust. Secrets go in .env, never here.

whisper:
  model: large-v3-turbo      # medium if RAM is tight
  device: cpu                # cuda | cpu
  compute_type: int8
  language: pt
  initial_prompt: "Spring, Liferay, endpoint, worktree, commit, backend, frontend"

kokoro:
  voice: pf_dora             # or pm_alex
  speed: 1.1
  # Said right when you stop talking, while Whisper and Claude work. Empty = chime only.
  acknowledgements: ["Certo.", "Deixa eu ver.", "Um momento.", "Só um instante."]

wakeword:
  name: Alfred
  model: wakeword/alfred.onnx  # trained by wakeword/train; or a pretrained name like hey_jarvis
  threshold: 0.5
  aliases: [alfred, alfredo]

listener:
  sample_rate: 16000
  silence_ms: 1200           # pause that ends a command; lower cuts you mid-sentence
  max_record_s: 15

agents:
  default_model: sonnet
  light_model: haiku         # simple questions + RESUMO fallback
  timeout_s: 60
  session_timeout_s: 300     # tasks Alfred delegates to the "sistema" session

limits:
  max_active_sessions: 3

permissions:
  default_confirmation: voice      # voice | key | web | voice+key
  per_action:
    git_push: key
    send_email: voice+key
    delete_file: voice
    install_dependency: voice
  tainted_turn: key
  timeout_s: 60                    # no answer = denied

router:
  fuzzy_threshold: 85

api:
  host: 0.0.0.0
  port: 8000

storage:
  db_path: data/alfred.sqlite3
  state_path: data/alfred_state.json
