<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Alfred icon</title>
    <!-- Rendered by apps/desktop/render_icon.mjs into the app icon: the real orb, round, with a
         soft transparent edge. -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #icon {
        width: 1024px;
        height: 1024px;
        mask-image: radial-gradient(circle closest-side, #000 calc(100% - 8px), transparent);
      }
    </style>
  </head>
  <body>
    <div id="icon"></div>
    <script type="module" src="/src/icon.tsx"></script>
  </body>
</html>
