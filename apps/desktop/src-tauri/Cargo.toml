[package]
name = "alfred-desktop"
version = "0.1.0"
description = "Alfred desktop shell: panel window, voice overlay and tray"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
